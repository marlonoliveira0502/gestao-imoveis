<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir Senha – Gestão de Imóveis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: white; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo .icon { font-size: 2.2rem; }
  .logo h1 { font-size: 1.2rem; font-weight: 700; color: #1e3a5f; margin-top: 8px; }
  .logo p { font-size: .82rem; color: #64748b; margin-top: 4px; }
  label { display: block; font-size: .82rem; font-weight: 600; color: #475569; margin-bottom: 4px; margin-top: 14px; }
  input { width: 100%; padding: 10px 13px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .92rem; transition: .2s; }
  input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .btn { width: 100%; margin-top: 22px; padding: 11px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: .95rem; font-weight: 700; cursor: pointer; transition: .15s; }
  .btn:hover { background: #1d4ed8; }
  .error { background: #fee2e2; color: #b91c1c; border-radius: 8px; padding: 10px 13px; font-size: .83rem; margin-top: 14px; }
  .success { background: #dcfce7; color: #15803d; border-radius: 8px; padding: 10px 13px; font-size: .83rem; margin-top: 14px; }
  .back { text-align: center; margin-top: 18px; font-size: .82rem; }
  .back a { color: #2563eb; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🔑</div>
    <h1>Nova Senha</h1>
    <p>Gestão de Imóveis · Invest Imobiliária</p>
  </div>

  {% if msg %}
    <div class="success">✅ {{ msg }}</div>
    <div class="back" style="margin-top:20px"><a href="/login">← Ir para o login</a></div>
  {% elif not token %}
    <div class="error">⚠️ {{ erro or 'Link inválido ou expirado.' }}</div>
    <div class="back" style="margin-top:16px"><a href="/esqueci-senha">← Solicitar novo link</a></div>
  {% else %}
    <form method="POST">
      <label>Nova Senha *</label>
      <input type="password" name="nova_senha" placeholder="Mínimo 4 caracteres" required autofocus>
      <label>Confirmar Nova Senha *</label>
      <input type="password" name="confirmar" placeholder="Repita a senha" required>
      {% if erro %}
      <div class="error">⚠️ {{ erro }}</div>
      {% endif %}
      <button class="btn" type="submit">Salvar Nova Senha</button>
    </form>
    <div class="back"><a href="/login">← Voltar ao login</a></div>
  {% endif %}
</div>
</body>
</html>
